<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="South African gender-based violence data map">
    <title>SA GBV Data Map</title>
    <link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
  </head>
  <body>
    <main class="map-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">SA GBV DATA</p>
          <h1>Safety layers across South Africa</h1>
        </div>
        <div class="status" id="status">Connecting to data</div>
      </header>
      <div class="map-wrap">
        <div id="map" aria-label="Interactive South African data map"></div>
        <aside class="panel" aria-label="Map layers">
          <h2>Layers</h2>
          <label class="layer-toggle"><input type="checkbox" data-layer="precincts" checked><span class="swatch swatch-precincts"></span><span>SAPS precincts</span></label>
          <label class="layer-toggle"><input type="checkbox" data-layer="crime" checked><span class="swatch swatch-crime"></span><span>Enriched crime</span></label>
          <label class="layer-toggle"><input type="checkbox" data-layer="municipal" checked><span class="swatch swatch-municipal"></span><span>Municipal and ward boundaries</span></label>
          <label class="layer-toggle"><input type="checkbox" data-layer="census" checked><span class="swatch swatch-census"></span><span>Census geography proxy (wards)</span></label>
          <label class="layer-toggle"><input type="checkbox" data-layer="osm" checked><span class="swatch swatch-osm"></span><span>OSM risk factors</span></label>
          <label class="layer-toggle"><input type="checkbox" data-layer="tcc" checked><span class="swatch swatch-tcc"></span><span>Thuthuzela Care Centres</span></label>
          <label class="layer-toggle"><input type="checkbox" data-layer="mobility" checked><span class="swatch swatch-mobility"></span><span>Public transport</span></label>
          <p class="note">GeoParquet: EPSG:9221<br>Tiles: browser Web Mercator</p>
        </aside>
      </div>
    </main>
    <script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
