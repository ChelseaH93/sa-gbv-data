name: Data pipeline

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      crime_url:
        description: "SAPS quarterly crime export URL; defaults to the SAPS_CRIME_URL repository variable"
        required: false
        type: string
      precinct_url:
        description: "SAPS precinct ZIP URL; defaults to the SAPS_PRECINCT_URL repository variable"
        required: false
        type: string
      census_sample_url:
        description: "R2/public URL for the Census 2022 sample ZIP"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: data-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests and source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Verify geoengine-utils
        run: python -c "import geoengine_utils; from geoengine_utils import assess_readiness; from geoengine_utils.cloud import convert_vector_to_pmtiles; print(geoengine_utils.__version__)"
      - name: Run unit tests
        run: python -m pytest -q
      - name: Compile source
        run: python -m compileall -q src tests

  update-and-publish:
    name: Refresh datasets and publish to R2
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    env:
      SAPS_CRIME_URL: ${{ inputs.crime_url || vars.SAPS_CRIME_URL || secrets.SAPS_CRIME_URL }}
      SAPS_PRECINCT_URL: ${{ inputs.precinct_url || vars.SAPS_PRECINCT_URL || secrets.SAPS_PRECINCT_URL }}
      MDB_BOUNDARIES_URL: ${{ vars.MDB_BOUNDARIES_URL || secrets.MDB_BOUNDARIES_URL }}
      CENSUS_SAL_URL: ${{ vars.CENSUS_SAL_URL || secrets.CENSUS_SAL_URL }}
      CENSUS_SAMPLE_URL: ${{ inputs.census_sample_url || vars.CENSUS_SAMPLE_URL || secrets.CENSUS_SAMPLE_URL }}
      TCC_KML_URL: ${{ vars.TCC_KML_URL || secrets.TCC_KML_URL || 'https://www.google.com/maps/d/u/0/kml?mid=1J5vQRQD2NXR36hwuig8OhV8uO2B5JX0i&forcekml=1' }}
      GTFS_URLS: ${{ vars.GTFS_URLS || secrets.GTFS_URLS }}
      OSM_SOUTH: ${{ vars.OSM_SOUTH || secrets.OSM_SOUTH }}
      OSM_WEST: ${{ vars.OSM_WEST || secrets.OSM_WEST }}
      OSM_NORTH: ${{ vars.OSM_NORTH || secrets.OSM_NORTH }}
      OSM_EAST: ${{ vars.OSM_EAST || secrets.OSM_EAST }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      SA_GBV_ALLOW_LARGE_OUTPUTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Verify geoengine-utils
        run: python -c "import geoengine_utils; from geoengine_utils import assess_readiness; from geoengine_utils.cloud import convert_vector_to_pmtiles; print(geoengine_utils.__version__)"
      - name: Download SAPS crime export
        run: |
          test -n "$SAPS_CRIME_URL" || (echo "Set the SAPS_CRIME_URL repository variable" && exit 1)
          mkdir -p data/raw data/processed data/pmtiles
          # SAPS currently serves an incomplete certificate chain; keep HTTPS and
          # restrict the exception to this known official source URL.
          case "$SAPS_CRIME_URL" in
            https://www.saps.gov.za/*) ;;
            *) echo "SAPS_CRIME_URL must use the official https://www.saps.gov.za host"; exit 1 ;;
          esac
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 --insecure "$SAPS_CRIME_URL" --output data/raw/saps_crime.xlsx
      - name: Ingest SAPS crime
        run: python -m sa_gbv_data.ingest.saps_crime data/raw/saps_crime.xlsx data/processed/saps_crime.parquet
      - name: Refresh precincts when configured
        if: env.SAPS_PRECINCT_URL != '' || hashFiles('data/raw/saps_station_boundaries_points.zip') != ''
        run: |
          precinct_source="$SAPS_PRECINCT_URL"
          if test -z "$precinct_source"; then precinct_source=data/raw/saps_station_boundaries_points.zip; fi
          python -m sa_gbv_data.ingest.saps_precincts "$precinct_source" data/processed/precincts.parquet
      - name: Enrich crime with precinct geometry
        if: hashFiles('data/processed/precincts.parquet') != ''
        run: |
          python -m sa_gbv_data.enrich \
            data/processed/saps_crime.parquet \
            data/processed/precincts.parquet \
            data/processed/saps_crime_enriched.parquet
      - name: Ingest municipal and ward boundaries
        if: env.MDB_BOUNDARIES_URL != ''
        run: |
          curl --fail --location --retry 3 "$MDB_BOUNDARIES_URL" --output data/raw/municipal_wards.download
          case "$MDB_BOUNDARIES_URL" in
            *.zip|*.ZIP)
              mkdir -p data/raw/municipal_wards
              unzip -o data/raw/municipal_wards.download -d data/raw/municipal_wards
              source_path=$(find data/raw/municipal_wards -type f -name 'zaf_admin4.shp' | head -n 1)
              if test -z "$source_path"; then source_path=$(find data/raw/municipal_wards -type f \( -name '*.shp' -o -name '*.geojson' -o -name '*.json' \) | head -n 1); fi
              ;;
            *) source_path=data/raw/municipal_wards.download ;;
          esac
          test -n "$source_path" && test -f "$source_path" || (echo "No MDB vector source found" && exit 1)
          python -m sa_gbv_data.ingest.municipal_wards "$source_path" data/processed/municipal_wards.parquet
      - name: Ingest Census SAL
        if: env.CENSUS_SAL_URL != ''
        run: |
          curl --fail --location --retry 3 "$CENSUS_SAL_URL" --output data/raw/census_sal.download
          case "$CENSUS_SAL_URL" in
            *.zip|*.ZIP)
              mkdir -p data/raw/census_sal
              unzip -o data/raw/census_sal.download -d data/raw/census_sal
              source_path=$(find data/raw/census_sal -type f \( -name '*.shp' -o -name '*.parquet' \) | head -n 1)
              ;;
            *) source_path=data/raw/census_sal.download ;;
          esac
          test -n "$source_path" && test -f "$source_path" || (echo "No Census SAL source found" && exit 1)
          python -m sa_gbv_data.ingest.census_sal "$source_path" data/processed/census_sal.parquet
      - name: Ingest Census 2022 sample bundle
        if: env.CENSUS_SAMPLE_URL != ''
        run: |
          curl --fail --location --retry 3 "$CENSUS_SAMPLE_URL" --output data/raw/census2022_sample.zip
          python -m sa_gbv_data.ingest.census_microdata data/raw/census2022_sample.zip data/processed
      - name: Ingest OSM infrastructure risk
        if: env.OSM_SOUTH != '' && env.OSM_WEST != '' && env.OSM_NORTH != '' && env.OSM_EAST != ''
        run: |
          if ! python -m sa_gbv_data.ingest.osm_risk \
              "$OSM_SOUTH" "$OSM_WEST" "$OSM_NORTH" "$OSM_EAST" \
              data/processed/osm_risk.parquet; then
            echo "Warning: Overpass endpoints unavailable; continuing without OSM risk output."
          fi
      - name: Ingest Thuthuzela Care Centres
        if: env.TCC_KML_URL != ''
        run: python -m sa_gbv_data.ingest.tcc_centres data/processed/tcc_centres.parquet --url "$TCC_KML_URL"
      - name: Ingest GTFS mobility feeds
        if: env.GTFS_URLS != ''
        run: python -m sa_gbv_data.ingest.gtfs "$GTFS_URLS" data/processed/mobility_stops.parquet data/processed/mobility_shapes.parquet
      - name: Run geoengine-utils checks
        run: |
          shopt -s nullglob
          spatial_files=(data/processed/precincts.parquet data/processed/saps_crime_enriched.parquet data/processed/municipal_wards.parquet data/processed/census_sal.parquet data/processed/osm_risk.parquet data/processed/tcc_centres.parquet data/processed/mobility_stops.parquet data/processed/mobility_shapes.parquet)
          checked=0
          for dataset in "${spatial_files[@]}"; do
            if test -f "$dataset"; then
              geoengine-utils validate "$dataset"
              checked=$((checked + 1))
            fi
          done
          if test "$checked" -eq 0; then
            echo "No spatial GeoParquet outputs found; configure SAPS_PRECINCT_URL to enable map enrichment."
          fi
      - name: Run geoengine-utils CI checks
        run: |
          spatial_files=(data/processed/precincts.parquet data/processed/saps_crime_enriched.parquet data/processed/municipal_wards.parquet data/processed/census_sal.parquet data/processed/osm_risk.parquet data/processed/tcc_centres.parquet data/processed/mobility_stops.parquet data/processed/mobility_shapes.parquet)
          checked=0
          for dataset in "${spatial_files[@]}"; do
            if test -f "$dataset"; then checked=$((checked + 1)); fi
          done
          if test "$checked" -eq 0; then
            echo "No spatial GeoParquet outputs found; skipping geoengine-utils CI checks."
            exit 0
          fi
          cat > .geoengine-utils-ci.generated.json <<'JSON'
          {
            "fail_on_warnings": true,
            "datasets": []
          }
          JSON
          for dataset in data/processed/precincts.parquet data/processed/saps_crime_enriched.parquet data/processed/municipal_wards.parquet data/processed/census_sal.parquet data/processed/osm_risk.parquet data/processed/tcc_centres.parquet data/processed/mobility_stops.parquet data/processed/mobility_shapes.parquet; do
            if test -f "$dataset"; then
              python - "$dataset" <<'PY'
          import json
          import sys
          from pathlib import Path

          config_path = Path(".geoengine-utils-ci.generated.json")
          config = json.loads(config_path.read_text())
          config["datasets"].append({"name": Path(sys.argv[1]).stem, "path": sys.argv[1]})
          config_path.write_text(json.dumps(config))
          PY
            fi
          done
          geoengine-utils ci .geoengine-utils-ci.generated.json --json
      - name: Upload all data artifacts to R2
        run: python -m sa_gbv_data.publish_r2 --root data --bucket "$R2_BUCKET" --endpoint-url "$R2_ENDPOINT_URL"