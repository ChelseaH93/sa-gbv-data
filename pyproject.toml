[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sa-gbv-data"
version = "0.1.0"
description = "Ingestion tools for South African crime, boundary, census, and infrastructure data."
requires-python = ">=3.10"
dependencies = [
    "geopandas>=0.14",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyogrio>=0.7",
    "requests>=2.31",
    "pdfplumber>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]